[project]
name = "math-atlas"
version = "0.1.0"
description = "Knowledge graph of advanced mathematics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blv",
    "chromadb>=1.5.1",
    "edlib>=1.3.9.post1",
    "more-itertools>=10.8.0",
    "neo4j>=6.1.0",
    "openai>=2.24.0",
    "pandas>=3.0.1",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipython>=9.10.0",
    "isort>=8.0.0",
]

[tool.black]
line-length = 120

[tool.uv.sources]
blv = { git = "https://github.com/offendo/blv", rev = "0.2.4" }
