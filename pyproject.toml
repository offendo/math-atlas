[project]
name = "math-atlas"
version = "0.1.0"
description = "Knowledge graph of advanced mathematics."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blv",
    "chromadb>=1.5.1",
    "datasets>=4.6.0",
    "edlib>=1.3.9.post1",
    "huggingface-hub<1.0.0",
    "langchain>=1.2.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.17",
    "langchain-localai>=1.0.0",
    "more-itertools>=10.8.0",
    "neo4j>=6.1.0",
    "openai>=2.24.0",
    "openai-harmony>=0.0.8",
    "pandas>=2.3.3",
    "requests>=2.32.5",
    "tiktoken>=0.12.0",
    "tqdm>=4.67.3",
    "transformers>=4.57.6",
    "vllm>=0.16",
]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "ipython>=9.10.0",
    "isort>=8.0.0",
]

[tool.black]
line-length = 120

[tool.uv.sources]
blv = { git = "https://github.com/offendo/blv.git" }
proofflow = { workspace = true }

[tool.uv.workspace]
members = [
    "proofflow",
]
